name: ✨ Feature request
description: Suggest a new feature or an improvement.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape Eddyter. Please search existing requests first and add a 👍 to ones you'd also like. We use reactions to set priorities.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - AI features
        - Formatting and toolbar
        - Tables
        - Media and embeds
        - Comments and mentions
        - Markdown
        - Version history
        - Email templates
        - Framework integration
        - Dashboard and plans
        - Accessibility
        - Languages and localization
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the situation and who is affected. For example, "Our support agents need to…"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Workarounds or other tools you've tried.
  - type: dropdown
    id: importance
    attributes:
      label: How important is this for you?
      options:
        - Nice to have
        - Important
        - Blocking us from adopting or upgrading
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Screenshots, mockups or examples from other products.
